<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-fr="IGP — Vins & Eaux-de-vie de France" data-en="IGP — Wines &amp; Spirits of France">IGP — Vins & Eaux-de-vie de France</title>
<style>
:root{--wine:#5e1020;--wine2:#4a0c19;--gold:#c9a24b;--parch:#f3ecdd;--ink:#231f20;
 --land:#efe7d4;--land2:#e7dcc3;--dept:#cdbe9c;--riv:#6f97b4;--sea:#f4f1ea;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--ink);background:#eae3d4}
#app{display:flex;height:100vh;overflow:hidden}
#side{width:340px;flex:0 0 340px;height:100%;overflow-y:auto;color:var(--parch);
 background:linear-gradient(160deg,var(--wine),var(--wine2));border-right:3px solid var(--gold);box-shadow:2px 0 12px rgba(0,0,0,.3)}
#side h1{font-size:20px;margin:0;padding:16px 16px 2px;letter-spacing:.3px}
#side .sub{font-size:12.5px;opacity:.82;padding:0 16px 10px;border-bottom:1px solid rgba(201,162,75,.35)}
#search{width:calc(100% - 24px);margin:10px 12px;padding:7px 10px;border-radius:6px;border:1px solid var(--gold);
 background:rgba(255,255,255,.94);color:#222;font:inherit;font-size:13px}
.grp{border-bottom:1px solid rgba(201,162,75,.22)}
.grp>.gh{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;user-select:none;font-size:14px;font-weight:600}
.grp>.gh .sw{width:14px;height:14px;border-radius:3px;flex:0 0 14px;border:1px solid rgba(0,0,0,.35)}
.grp>.gh .ct{margin-left:auto;font-size:11.5px;opacity:.8;font-weight:400}
.grp>.gh .eye{font-size:12px;opacity:.85}
.row{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 30px;font-size:13px;cursor:pointer;line-height:1.15}
.row:hover{background:rgba(201,162,75,.20)}
.row.sel{background:var(--gold);color:#3a0a12;font-weight:700}
.row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;opacity:.9}
.row .n{margin-left:auto;font-size:10.5px;opacity:.72}
.row.sel .n{opacity:.9}
.hidecat .rows{display:none}
#stage{position:relative;flex:1;height:100%;background:radial-gradient(circle at 50% 42%,#f6f2e9,#e6ddca);overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}
svg.drag{cursor:grabbing}
#france{fill:var(--land);stroke:#9c875e;stroke-width:1.6;stroke-linejoin:round;
 filter:drop-shadow(3px 5px 5px rgba(90,70,35,.28))}
#depts{fill:none;stroke:var(--dept);stroke-width:.9;stroke-opacity:.75;vector-effect:non-scaling-stroke}
.riv{fill:none;stroke:var(--riv);stroke-width:1.5;stroke-opacity:.85;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
#igp path{stroke:#5a1520;stroke-width:.8;stroke-opacity:.45;vector-effect:non-scaling-stroke;transition:fill-opacity .12s}
#igp path.dim{fill-opacity:.05 !important;stroke-opacity:.12}
#igp path.hot{stroke:#2a0a10;stroke-width:2.2;fill-opacity:.74 !important}
.lbl{paint-order:stroke;stroke:#f3efe4;stroke-width:3px;stroke-linejoin:round}
.city{fill:#231f20;font-size:26px;font-style:italic}
.city.big{font-size:31px;font-weight:700}
.cdot{fill:#231f20}
.sea{fill:#4c54a4;font-style:italic;font-size:46px;opacity:.85;stroke:none}
.ctry{fill:#6a6663;font-size:44px;opacity:.8;stroke:none}
.river{fill:#4f7ea0;font-style:italic;font-size:20px;stroke:#f1ede2;stroke-width:2.4px;opacity:.95;dominant-baseline:middle}
#ctrl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#ctrl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--gold);background:rgba(94,16,32,.92);color:var(--parch);font-size:18px;cursor:pointer}
#ctrl button:hover{background:var(--wine)}
#info{position:absolute;left:14px;top:14px;max-width:300px;background:rgba(247,242,230,.97);border:1px solid var(--gold);
 border-left:6px solid var(--wine);border-radius:8px;padding:10px 13px;box-shadow:0 4px 14px rgba(0,0,0,.22);display:none;z-index:5}
#info h2{margin:0 0 3px;font-size:17px;color:var(--wine)}
#info .meta{font-size:12.5px;color:#555}
#info .cat{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;margin-top:5px}
 #info{max-height:calc(100% - 28px);overflow-y:auto}
 #info .ibody{margin-top:9px;padding-top:8px;border-top:1px solid rgba(201,162,75,.5);font-size:12.5px;color:#3a2b23;line-height:1.5}
 #info .drow{margin:6px 0}
 #info .dlab{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#9a7d43;margin-bottom:3px}
 #info .chip{display:inline-block;padding:1px 9px;border-radius:11px;font-size:11px;margin:2px 3px 2px 0;border:1px solid rgba(0,0,0,.12)}
 #info .col-Rouge{background:#7a1524;color:#fff;border-color:#5a0f1a}
 #info .col-Ros\u00e9{background:#e7a6b0;color:#66121f}
 #info .col-Gris{background:#d7cfc0;color:#4a4033}
 #info .col-Blanc{background:#efe4bf;color:#6b5a1e}
 #info .stychip{background:#efe7d4;color:#5b4a2a}
 #info .denom{font-style:italic;color:#5b4a2a}
 #info .deleg{color:#6a5a44}
 #info .cdc{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 0 0;padding:6px 11px;border-radius:7px;background:var(--wine);color:var(--parch);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--gold)}
 #info .cdc:hover{background:var(--wine2)}
 #info .cdc.two{background:#8a4718}
 #info .nolink{font-size:11px;color:#9a7f55;font-style:italic;margin-top:5px}
#info .close{position:absolute;right:8px;top:6px;cursor:pointer;color:#999;font-size:16px}
#tip{position:absolute;pointer-events:none;background:rgba(35,31,32,.92);color:#f6efe0;padding:3px 8px;border-radius:5px;font-size:12.5px;z-index:6;display:none;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(94,16,32,.86);color:var(--parch);font-size:12px;padding:5px 12px;border-radius:14px;z-index:5}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(247,242,230,.95);border:1px solid var(--gold);border-radius:8px;padding:8px 11px;font-size:12px;z-index:5}
#legend .li{display:flex;align-items:center;gap:7px;margin:2px 0}
#legend .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
</style><style id="fw-mobile-css">
/* phones / narrow windows: list above the map instead of squeezing it */
@media (max-width:700px){
  #app{flex-direction:column;height:100vh;height:100dvh}
  #side{width:auto;flex:0 0 auto;height:auto;max-height:38vh;border-right:0;border-bottom:3px solid var(--gold)}
  #stage{flex:1 1 auto;height:auto;min-height:0}
}
</style>

html[data-theme="cream"] #side{color:#2e1419;background:linear-gradient(160deg,#fbf6ec,#fbf6ec);border-right:3px solid #9a6a1f;box-shadow:2px 0 12px rgba(90,40,30,0.09)}
html[data-theme="cream"] #side .sub{border-bottom:1px solid rgba(154,106,31,0.43)}

html[data-theme="cream"] #info .ibody{border-top:1px solid rgba(154,106,31,0.60)}

</style><!--fw-theme:end-->
<!--fw-igpfilter:start--><style id="fw-igpfilter-css">
#allIgp{position:absolute;left:12px;top:12px;z-index:6;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;
 font:600 12.5px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em;cursor:pointer;
 background:var(--wine);color:var(--parch);border:1px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.18)}
#allIgp:hover{background:var(--wine2)}
#allIgp .sws{display:inline-flex;gap:2px}#allIgp .sws i{width:7px;height:11px;border-radius:2px;display:block}
#allIgp.on{opacity:.55;cursor:default}
#filtNote{display:none;margin:8px 12px 0;padding:6px 10px;border-radius:6px;font-size:12.5px;border:1px solid rgba(201,162,75,.5);background:rgba(201,162,75,.12)}
#filtNote .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
#legend .li{cursor:pointer;border-radius:4px;padding:1px 4px;margin:1px -4px}
#legend .li:hover{background:rgba(94,16,32,.08)}
#legend .li.off{opacity:.35}
#legend .li.cur{font-weight:700}
.grp.fhide{display:none}
html[data-theme="cream"] #filtNote{border-color:rgba(154,106,31,.45);background:rgba(154,106,31,.08)}

</style><!--fw-igpfilter:end-->
